<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSB月赛杯 · 报名</title>
    <style>
        :root {
            --bg: #0a0e17;
            --panel: #131a25;
            --border: #2a3340;
            --text: #d0d5dd;
            --accent: #4a9eff;
            --win: #1f9e5c;
            --lose: #c44545;
            --gold: #f0b90b;
            --muted: #7c8798;
            --radius: 8px;
            --shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif; }
        body { background:var(--bg); color:var(--text); min-height:100vh; }

        .topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .topbar-brand svg { color: var(--accent); }
        .topbar-nav { display: flex; gap: 4px; }
        .topbar-nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .topbar-nav a:hover,
        .topbar-nav a.active {
            color: #fff;
            background: rgba(74,158,255,0.1);
        }
        .topbar-nav a.active { color: var(--accent); }

        .container { max-width: 900px; width: 100%; margin: 32px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: var(--muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: #0f1620;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }
        .form-group textarea { resize: vertical; min-height: 60px; font-family: inherit; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        button {
            background: #1e2b3f;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        button:hover { background: #2a3a52; border-color: var(--accent); color: #fff; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
        button.primary:hover { box-shadow: 0 0 12px rgba(74,158,255,0.4); }
        button.danger { border-color: var(--lose); color: var(--lose); }
        button.danger:hover { background: #3a1e1e; color: #e05a5a; }
        button:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
        .lock-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .lock-btn.unlocked { border-color: var(--win); color: var(--win); }
        .lock-btn:hover { background: #2a2a10; }
        .lock-btn.unlocked:hover { background: #0f1a15; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-open { background: #1f9e5c20; color: var(--win); border: 1px solid var(--win); }
        .status-closed { background: #c4454520; color: var(--lose); border: 1px solid var(--lose); }
        .status-full { background: #f0b90b20; color: var(--gold); border: 1px solid var(--gold); }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.8rem; padding: 10px 8px; background: #0f1620; border-bottom: 1px solid var(--border); }
        td { padding: 10px 8px; border-bottom: 1px solid #1f2937; }
        tr:hover { background: #1b2330; }

        .reg-num { font-weight: 700; color: var(--accent); }

        .message { padding: 12px 16px; border-radius: 6px; margin: 12px 0; display: none; }
        .message.success { display: block; background: #1f9e5c15; border: 1px solid var(--win); color: var(--win); }
        .message.error { display: block; background: #c4454515; border: 1px solid var(--lose); color: var(--lose); }

        .admin-section { border: 1px solid var(--gold); border-radius: var(--radius); padding: 20px; margin-top: 16px; background: #131a25; display: none; }
        .admin-section.visible { display: block; }
        .admin-section h3 { color: var(--gold); font-size: 1rem; margin-bottom: 12px; }

        @media (max-width: 768px) {
            .topbar { padding: 0 12px; }
            .topbar-brand { font-size: 0.9rem; }
            .topbar-nav a { padding: 6px 10px; font-size: 0.8rem; }
            .container { margin: 16px auto; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a href="/" class="topbar-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M15 4l5 5M4 15l5 5"/></svg>
        DSB月赛杯
    </a>
    <div class="topbar-nav">
        <a href="/">赛事章程</a>
        <a href="/saicheng">积分榜</a>
        <a href="/bracket">淘汰赛</a>
        <a href="/videos">录像库</a>
        <a href="/register" class="active">报名</a>
        <a href="/admin" title="管理后台" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:40px;text-decoration:none;border-radius:6px;transition:background 0.2s;" onmouseover="this.style.background='rgba(102,252,241,0.12)'" onmouseout="this.style.background=''"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#66fcf1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>    
    </div>
    <div style="display:flex;align-items:center;gap:4px;margin-left:8px;">
        <a href="#" onclick="switchLang('zh')" id="lang_zh" style="font-size:0.75rem;padding:4px 6px;border-radius:4px;text-decoration:none;color:var(--muted);font-weight:600;">中</a>
        <span style="color:var(--muted);font-size:0.65rem;">|</span>
        <a href="#" onclick="switchLang('en')" id="lang_en" style="font-size:0.75rem;padding:4px 6px;border-radius:4px;text-decoration:none;color:var(--muted);font-weight:600;">EN</a>
    </div>
</nav>

<div class="container">
    <!-- 报名状态 -->
    <div class="card" id="statusCard">
        <div class="card-header">
            <span id="regTitle">DSB月赛杯报名</span>
            <span id="regStatusBadge" class="status-badge status-closed">加载中...</span>
        </div>
        <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
            <span>已报名: <strong id="regCount">0</strong> / <span id="maxSlots">24</span> 人</span>
            <div>
                <button class="lock-btn" id="adminUnlockBtn" onclick="toggleAdmin()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 管理员</button>
            </div>
        </div>
        <div id="adminSection" class="admin-section">
            <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 管理面板</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>比赛名称</label>
                    <input type="text" id="inputTitle" value="DSB月赛杯报名">
                </div>
                <div class="form-group">
                    <label>选手名额</label>
                    <input type="number" id="inputMaxSlots" value="24" min="2" max="999">
                </div>
            </div>
            <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                <button id="toggleRegBtn" class="primary" onclick="toggleRegistration()">打开报名</button>
                <button onclick="saveAdminConfig()">保存设置</button>
                <button class="lock-btn unlocked" onclick="toggleAdmin()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> 退出管理</button>
            </div>
            <p style="color:var(--muted); font-size:0.85rem; margin-top:8px;">点击「保存设置」生效，切换报名通道点击对应按钮。</p>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="messageBox" class="message"></div>

    <!-- 报名表单 -->
    <div class="card" id="formCard">
        <div class="card-header"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> 选手报名</div>
        <div class="form-row">
            <div class="form-group">
                <label>选手名称 *</label>
                <input type="text" id="inputName" placeholder="游戏ID" maxlength="32">
            </div>
            <div class="form-group">
                <label>天梯MMR</label>
                <input type="number" id="inputMmr" placeholder="历史最高MMR" min="0" max="99999">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>常用种族</label>
                <select id="inputRace">
                    <option value="">未指定</option>
                    <option value="z">Z - 虫族</option>
                    <option value="p">P - 神族</option>
                    <option value="t">T - 人族</option>
                </select>
            </div>
            <div class="form-group">
                <label>备注 (可选)</label>
                <input type="text" id="inputComment" placeholder="联系方式等" maxlength="100">
            </div>
        </div>
        <button class="primary" onclick="submitRegistration()" id="submitBtn">提交报名</button>
    </div>

    <!-- 报名列表 -->
    <div class="card">
        <div class="card-header"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> 报名列表 <span style="font-size:0.85rem;color:var(--muted);font-weight:400;" id="listCount"></span></div>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>选手</th>
                        <th>MMR</th>
                        <th>种族</th>
                        <th>备注</th>
                        <th>报名时间</th>
                        <th id="adminCol" style="display:none;">操作</th>
                    </tr>
                </thead>
                <tbody id="regTableBody"></tbody>
            </table>
        </div>
        <p id="emptyHint" style="text-align:center;color:var(--muted);padding:20px;">暂无报名</p>
    </div>
</div>

<script>
let isAdmin = false;
let adminPassword = localStorage.getItem('dsb_admin_pwd') || '';

function showMessage(text, type) {
    const box = document.getElementById('messageBox');
    box.textContent = text;
    box.className = 'message ' + type;
    setTimeout(() => { box.className = 'message'; }, 5000);
}

async function fetchAPI(url, opts = {}) {
    if (adminPassword) {
        opts.headers = { ...(opts.headers || {}), 'X-Admin-Password': adminPassword };
    }
    const res = await fetch(url, opts);
    if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || '请求失败');
    }
    return res.json();
}

async function loadConfig() {
    try {
        const cfg = await fetchAPI('/api/register/config');
        document.getElementById('regTitle').textContent = cfg.title || 'DSB月赛杯报名';
        document.getElementById('inputTitle').value = cfg.title || '';
        document.getElementById('inputMaxSlots').value = cfg.max_slots || '24';
        document.getElementById('maxSlots').textContent = cfg.max_slots || '24';
        updateStatusBadge(cfg.open === 'true', parseInt(cfg.max_slots || '24'));
    } catch (e) {
        console.error(e);
    }
}

async function loadRegistrations() {
    try {
        const data = await fetchAPI('/api/register/list');
        const regs = data.registrations || [];
        const count = data.count || 0;
        document.getElementById('regCount').textContent = count;
        document.getElementById('listCount').textContent = `(共${count}人)`;

        const tbody = document.getElementById('regTableBody');
        tbody.innerHTML = '';
        document.getElementById('emptyHint').style.display = regs.length === 0 ? 'block' : 'none';

        regs.forEach((r, i) => {
            const tr = document.createElement('tr');
            const raceMap = { 'z': 'Z 虫族', 'p': 'P 神族', 't': 'T 人族', '': '-' };
            tr.innerHTML = `
                <td class="reg-num">${i + 1}</td>
                <td><strong>${r.name}</strong></td>
                <td>${r.mmr || '-'}</td>
                <td>${raceMap[r.race] || r.race || '-'}</td>
                <td>${r.comment || '-'}</td>
                <td style="font-size:0.85rem;color:var(--muted);">${r.created_at || '-'}</td>
                <td style="display:${isAdmin ? 'table-cell' : 'none'};">
                    <button class="danger" onclick="deleteReg(${r.id})" style="padding:4px 10px;font-size:0.8rem;">删除</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('adminCol').style.display = isAdmin ? 'table-cell' : 'none';
    } catch (e) {
        console.error(e);
    }
}

function updateStatusBadge(open, maxSlots) {
    const badge = document.getElementById('regStatusBadge');
    const count = parseInt(document.getElementById('regCount').textContent || '0');
    if (count >= maxSlots) {
        badge.textContent = '已满员';
        badge.className = 'status-badge status-full';
    } else if (open) {
        badge.textContent = '报名中';
        badge.className = 'status-badge status-open';
    } else {
        badge.textContent = '已关闭';
        badge.className = 'status-badge status-closed';
    }
    document.getElementById('submitBtn').disabled = !open || count >= maxSlots;
}

async function submitRegistration() {
    const name = document.getElementById('inputName').value.trim();
    if (!name) { showMessage('请填写选手名称', 'error'); return; }
    const mmr = parseInt(document.getElementById('inputMmr').value || '0');
    const race = document.getElementById('inputRace').value;
    const comment = document.getElementById('inputComment').value.trim();

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, mmr, race, comment }),
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({ detail: '报名失败' }));
            throw new Error(err.detail);
        }
        showMessage('报名成功！', 'success');
        document.getElementById('inputName').value = '';
        document.getElementById('inputMmr').value = '';
        document.getElementById('inputRace').value = '';
        document.getElementById('inputComment').value = '';
        await loadRegistrations();
        await loadConfig();
    } catch (e) {
        showMessage(e.message, 'error');
    }
}

function toggleAdmin() {
    if (!isAdmin) {
        const pwd = prompt('请输入管理员密码:');
        if (pwd) {
            adminPassword = pwd;
            localStorage.setItem('dsb_admin_pwd', pwd);
            isAdmin = true;
            document.getElementById('adminSection').classList.add('visible');
            document.getElementById('adminUnlockBtn').textContent = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> 管理员';
            document.getElementById('adminUnlockBtn').className = 'lock-btn unlocked';
            loadRegistrations();
        }
    } else {
        isAdmin = false;
        adminPassword = '';
        localStorage.removeItem('dsb_admin_pwd');
        document.getElementById('adminSection').classList.remove('visible');
        document.getElementById('adminUnlockBtn').textContent = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 管理员';
        document.getElementById('adminUnlockBtn').className = 'lock-btn';
        document.getElementById('adminCol').style.display = 'none';
        loadRegistrations();
    }
}

async function saveAdminConfig() {
    try {
        await fetchAPI('/api/register/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: 'title', value: document.getElementById('inputTitle').value }),
        });
        await fetchAPI('/api/register/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: 'max_slots', value: document.getElementById('inputMaxSlots').value }),
        });
        showMessage('设置已保存', 'success');
        await loadConfig();
    } catch (e) {
        showMessage(e.message, 'error');
    }
}

async function toggleRegistration() {
    try {
        const cfg = await fetchAPI('/api/register/config');
        const newState = cfg.open === 'true' ? 'false' : 'true';
        await fetchAPI('/api/register/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: 'open', value: newState }),
        });
        const btn = document.getElementById('toggleRegBtn');
        btn.textContent = newState === 'true' ? '关闭报名' : '打开报名';
        await loadConfig();
        showMessage(newState === 'true' ? '报名通道已开启' : '报名通道已关闭', 'success');
    } catch (e) {
        showMessage(e.message, 'error');
    }
}

async function deleteReg(rid) {
    if (!confirm('确定删除该报名？')) return;
    try {
        await fetchAPI(`/api/register/${rid}`, { method: 'DELETE' });
        showMessage('已删除', 'success');
        await loadRegistrations();
        await loadConfig();
    } catch (e) {
        showMessage(e.message, 'error');
    }
}

// 如果本地保存了密码，自动解锁
if (localStorage.getItem('dsb_admin_pwd')) {
    adminPassword = localStorage.getItem('dsb_admin_pwd');
    isAdmin = true;
    document.getElementById('adminSection').classList.add('visible');
    document.getElementById('adminUnlockBtn').textContent = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> 管理员';
    document.getElementById('adminUnlockBtn').className = 'lock-btn unlocked';
}

loadConfig();
loadRegistrations();
</script>

</body>
</html>
